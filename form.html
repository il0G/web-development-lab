<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бүртгэлийн форм</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Хэрэглэгчийн бүртгэл</h1>
    </header>

    <main class="main-container">
        <form action="#" method="POST" class="form-card">
            
            <div class="form-group">
                <label for="username" class="form-label">Бүрэн нэр:</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input"
                    required 
                    pattern="[A-Za-zА-Яа-яӨөҮү\s]{2,50}"
                >
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Имэйл хаяг:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input"
                    required
                >
            </div>

            <div class="form-group position-container">
                <label for="password" class="form-label">Нууц үг:</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input"
                    required 
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                >
                <span class="badge">Нууцлалтай</span>
            </div>

            <div class="form-group">
                <label for="dob" class="form-label">Төрсөн огноо:</label>
                <input 
                    type="date" 
                    id="dob" 
                    name="dob" 
                    class="form-input"
                    required
                >
            </div>

            <fieldset class="form-fieldset">
                <legend class="form-legend">Хүйс:</legend>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" id="male" name="gender" value="male" required> Эрэгтэй
                    </label>
                    <label class="radio-label">
                        <input type="radio" id="female" name="gender" value="female"> Эмэгтэй
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="city" class="form-label">Байршил:</label>
                <select id="city" name="city" class="form-select" required>
                    <option value="">-- Сонгоно уу --</option>
                    <option value="ub">Улаанбаатар</option>
                    <option value="darkhan">Дархан</option>
                    <option value="erdenet">Эрдэнэт</option>
                    <option value="other">Бусад</option>
                </select>
            </div>

            <fieldset class="form-fieldset">
                <legend class="form-legend">Сонирхол:</legend>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="tech" name="interests" value="tech"> Технологи
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="sports" name="interests" value="sports"> Спорт
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="art" name="interests" value="art"> Урлаг
                    </label>
                </div>
            </fieldset>

            <button type="submit" class="submit-btn">Бүртгүүлэх</button>

        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Бүх эрх хуулиар хамгаалагдсан.</p>
    </footer>

</body>
</html>
